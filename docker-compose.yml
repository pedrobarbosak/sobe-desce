# Self-hosted Sobe e Desce: Convex backend on Postgres, the static frontend, and the
# Cloudflare tunnel that puts both on the internet.
#
# Every port binds to 127.0.0.1 on purpose. Nothing here is reachable from the network
# except through the tunnel, which terminates TLS at Cloudflare's edge.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The backend's own SQLite store reads whole ranges of its history into memory at once
  # (get-convex/convex-backend#495), so its RAM grows with the size of the database until
  # the box falls over. Postgres pages those reads. Not published on any port: only the
  # backend talks to it, over the compose network.
  postgres:
    image: postgres:17-alpine
    container_name: sobe-desce-postgres
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128mb
    environment:
      - POSTGRES_USER=convex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?run scripts/bootstrap.sh}
      # Read by the init script, which names the database after it.
      - INSTANCE_NAME=${INSTANCE_NAME:-sobe-desce}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory only.
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/convex.sh:ro
    healthcheck:
      test: pg_isready -U convex -d postgres
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    # Pinned, and the dashboard below must match it: a restart should never upgrade a
    # stateful backend behind your back. docs/DEPLOY.md has how to move it on.
    image: ghcr.io/get-convex/convex-backend:${CONVEX_REV:-5c7cb5bc7db457290f1769f95f1d1340912f7fd7}
    container_name: sobe-desce-convex
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    # A ceiling, so a runaway backend is killed and restarted on its own instead of pushing
    # the whole machine into swap. Swap is capped at the same figure, i.e. none.
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-3g}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3210}:3210"
      - "127.0.0.1:${SITE_PORT:-3211}:3211"
    # Files and scratch space; the documents themselves are in Postgres.
    volumes:
      - data:/convex/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # These must be the URLs a browser uses, not the internal ones. If they disagree
      # the client connects and then fails auth in a way that is painful to debug.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:?set it in .env.deploy}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:?set it in .env.deploy}
      - INSTANCE_NAME=${INSTANCE_NAME:-sobe-desce}
      - INSTANCE_SECRET=${INSTANCE_SECRET:?run scripts/bootstrap.sh}
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      - RUST_LOG=${RUST_LOG:-info}
      # No database name: the backend appends its own, INSTANCE_NAME with - turned into _.
      # The password is hex, so it needs no escaping in a URL.
      - POSTGRES_URL=postgresql://convex:${POSTGRES_PASSWORD:?run scripts/bootstrap.sh}@postgres:5432
      # Plain TCP on the private compose network.
      - DO_NOT_REQUIRE_SSL=1
      # Every old revision of a document is kept this long (the backend's default is 14
      # days). A busy fortnight of bot games once took the database past 2 GB. Pick a value
      # and keep it: lowering it and later raising it can wedge retention
      # (get-convex/convex-backend#358).
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-259200}
      # Finished scheduled jobs (turn timers, bot moves) kept for a day, not a week.
      - SCHEDULED_JOB_RETENTION=${SCHEDULED_JOB_RETENTION:-86400}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      args:
        # Baked into the bundle at build time; a change here needs a rebuild.
        VITE_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:?}
        VITE_CONVEX_SITE_URL: ${CONVEX_SITE_ORIGIN:?}
        VITE_APP_URL: https://${APP_HOST:?}
    image: sobe-desce-web:${WEB_TAG:-latest}
    container_name: sobe-desce-web
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  # Kept off the tunnel deliberately: it is an unauthenticated admin console. Reach it
  # over SSH with `ssh -L 6791:127.0.0.1:6791 user@vps`.
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_REV:-5c7cb5bc7db457290f1769f95f1d1340912f7fd7}
    container_name: sobe-desce-dashboard
    logging: *logging
    restart: unless-stopped
    profiles: ["dashboard"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-6791}:6791"
    environment:
      # Deliberately the local address, not the public one: this console is reached over
      # an SSH forward, and is most needed when the tunnel is the thing that is broken.
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:${BACKEND_PORT:-3210}
    depends_on:
      backend:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sobe-desce-tunnel
    logging: *logging
    restart: unless-stopped
    # The image runs as uid 65532, which cannot read a 0600 credentials file owned by the
    # host user. Run as that user instead of loosening the file. scripts/tunnel.sh writes
    # TUNNEL_USER; the fallback is the image's own default.
    user: "${TUNNEL_USER:-65532:65532}"
    # Docker networks are IPv4 only unless you go out of your way, but cloudflared's default
    # is to take whatever address the edge resolves to, which is often IPv6. It then dies on
    # "sendmsg: network is unreachable". Pin the address family; set this to 6 or auto only
    # if the host really does have IPv6 out.
    command: >-
      tunnel --no-autoupdate
      --edge-ip-version ${TUNNEL_EDGE_IP_VERSION:-4}
      --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  data:
  pgdata:
