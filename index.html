<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sobe e Desce</title>
    <meta
      name="description"
      content="O jogo de cartas português, online e em tempo real. Convida os amigos, escolhe o trunfo e chega aos zero pontos antes dos outros."
    />
    <meta name="theme-color" content="#0f3d27" />

    <!-- Installable on a phone's home screen. Also the gate on web push on iOS, which is
         only delivered to sites added to the Home Screen with display: standalone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sobe e Desce" />

    <!-- An invite is a link pasted into a group chat, so it needs to unfurl into something.
         The URLs here are root-relative; the Vite config rewrites them to absolute at build
         time when VITE_APP_URL is set, because most chat clients will not resolve a
         relative og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sobe e Desce" />
    <meta property="og:title" content="Sobe e Desce · Jogo de cartas online" />
    <meta
      property="og:description"
      content="O jogo de cartas português, online e em tempo real. Convida os amigos, escolhe o trunfo e chega aos zero pontos antes dos outros."
    />
    <!-- A wide picture, not the app icon: most clients show a large preview only for a
         landscape image. Its source is scripts/og-image.html. Width and height let
         Facebook and WhatsApp draw it on the first share instead of after a re-scrape. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sobe e Desce: três cartas, o 7, o Rei e o Ás, sobre o pano verde da mesa." />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sobe e Desce · Jogo de cartas online" />
    <meta
      name="twitter:description"
      content="O jogo de cartas português, online e em tempo real. Convida os amigos, escolhe o trunfo e chega aos zero pontos antes dos outros."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="Sobe e Desce: três cartas, o 7, o Rei e o Ás, sobre o pano verde da mesa." />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
