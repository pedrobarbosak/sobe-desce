<!doctype html>
<!-- Source for public/og-image.jpg, the picture a shared link unfurls with.
     Regenerate with `npm run og-image` after changing it. 1200x630 is the size
     Facebook, WhatsApp, Discord, Slack and X all crop the least. -->
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, system-ui, sans-serif;
    color: #f7ecd2;
    background:
      radial-gradient(ellipse at 72% 45%, rgb(255 255 255 / 0.10), transparent 55%),
      repeating-radial-gradient(circle at 50% 50%, rgb(0 0 0 / 0.04) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, #1b5e3b, #0f3d27);
  }
  .rim { position: absolute; inset: 22px; border: 2px solid rgb(232 184 74 / 0.35); border-radius: 28px; }
  .copy { position: absolute; left: 88px; top: 0; bottom: 0; width: 530px; display: flex; flex-direction: column; justify-content: center; }
  .mark { font-size: 30px; color: #e8b84a; letter-spacing: 0.18em; font-weight: 600; text-transform: uppercase; }
  h1 { margin: 14px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 112px; line-height: 0.95; color: #fffaf0; letter-spacing: -0.02em; }
  h1 span { color: #e8b84a; }
  p { margin: 28px 0 0; font-size: 32px; line-height: 1.35; color: rgb(247 236 210 / 0.88); font-weight: 500; }
  .pill { margin-top: 34px; align-self: flex-start; padding: 12px 22px; border-radius: 999px; background: #e8b84a; color: #1b1611; font-weight: 600; font-size: 26px; }

  /* The same faces the table draws: see .card-face and .card-court in src/index.css. */
  .fan { position: absolute; left: 690px; top: 100px; width: 440px; height: 420px; transform: scale(0.92); transform-origin: 100% 50%; }
  .card {
    position: absolute; width: 210px; height: 298px; border-radius: 22px;
    background: linear-gradient(160deg, #fffdf8 0%, #f7eed6 100%);
    box-shadow: 0 2px 4px rgb(0 0 0 / 0.25), 0 22px 50px rgb(0 0 0 / 0.45);
    font-family: Fraunces, Georgia, serif; font-weight: 800; transform-origin: 50% 120%;
  }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 5px solid #d9a02f; box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.75); }
  .idx { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: 50px; }
  .idx i { font-style: normal; font-size: 40px; }
  .tl { left: 16px; top: 12px; } .br { right: 16px; bottom: 12px; transform: rotate(180deg); }
  .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .mid b { font-size: 120px; } .mid i { font-style: normal; font-size: 64px; }
  .h { color: #d1213a; } .d { color: #e4501e; } .s { color: #1c2b4a; }
</style>
</head>
<body>
  <div class="rim"></div>
  <div class="copy">
    <div class="mark">♠ Jogo de cartas</div>
    <h1>Sobe <span>e</span> Desce</h1>
    <p>O jogo de cartas português, online e em tempo real. Chega aos zero pontos antes dos outros.</p>
    <div class="pill">Convida os amigos e joga</div>
  </div>
  <div class="fan">
    <div class="card s" style="left: 10px; top: 40px; transform: rotate(-14deg)">
      <div class="idx tl">7<i>♠</i></div><div class="idx br">7<i>♠</i></div><div class="mid"><b>7</b><i>♠</i></div>
    </div>
    <div class="card d" style="left: 115px; top: 10px; transform: rotate(0deg)">
      <div class="idx tl">K<i>♦</i></div><div class="idx br">K<i>♦</i></div><div class="mid"><b>K</b><i>♦</i></div>
    </div>
    <div class="card h" style="left: 212px; top: 40px; transform: rotate(14deg)">
      <div class="idx tl">A<i>♥</i></div><div class="idx br">A<i>♥</i></div><div class="mid"><b>A</b><i>♥</i></div>
    </div>
  </div>
</body>
</html>
